name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny,cargo-hack
      - name: Check dependencies and feature combinations
        run: |
          cargo deny --all-features --log-level error check
          # cargo-hack changes manifests for --no-dev-deps, so its lockfile must be writable.
          cargo hack check --feature-powerset --no-dev-deps

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install libseccomp
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libseccomp-dev
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    needs:
      - check
      - lints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record native execution environment
        env:
          EXPECTED_ARCH: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
        run: |
          mkdir -p ci-results
          uname -a | tee ci-results/environment.log
          git rev-parse HEAD | tee -a ci-results/environment.log
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Allow unprivileged namespace creation
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install libseccomp
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libseccomp-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Record toolchain
        run: '{ rustc -Vv; cargo -V; } | tee -a ci-results/environment.log'
      - name: Check Landlock kernel support
        run: |
          timeout 5m cargo test --locked --features landlock -p hakoniwa --test landlock_test -- --nocapture 2>&1 | tee ci-results/landlock-kernel.log
      - name: Test library with all features
        run: |
          timeout 15m cargo test --locked --all-features --all-targets -p hakoniwa -- --nocapture 2>&1 | tee ci-results/hakoniwa.log
      - name: Test library documentation examples
        run: |
          timeout 5m cargo test --locked --all-features --doc -p hakoniwa -- --nocapture 2>&1 | tee ci-results/hakoniwa-doctests.log
      - name: Test CLI with all features
        if: matrix.os == 'ubuntu-24.04'
        run: |
          timeout 10m cargo test --locked --all-features --all-targets -p hakoniwa-cli -- --nocapture 2>&1 | tee ci-results/hakoniwa-cli.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-logs-${{ matrix.os }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn

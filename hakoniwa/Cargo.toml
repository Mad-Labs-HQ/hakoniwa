[package]
name = "mad-hakoniwa"
version = "1.8.0-mad.1"
description = "Mad Labs maintenance fork of hakoniwa with process ownership and supervisor repairs."
keywords = ["security", "sandbox", "container", "process"]
categories = ["security"]
build = "build.rs"
publish = false
include = ["build.rs", "src/**/*", "LICENSE", "COPYING", "README.md", "FORK.md", "PATCH.md", "PATCH.diff", "UPSTREAM-CHECKSUMS.json"]
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
readme = "README.md"
edition = "2024"

[lib]
name = "hakoniwa"

[dependencies]
bitflags = "2.11.1"
caps = "0.5.6"
close_fds = "0.3.2"
landlock = { version = "0.4.4", optional = true }
libc = "0.2.186"
libcgroups = { version = "0.7.0", optional = true }
libseccomp = { version = "0.4.0", optional = true }
log = "0.4.29"
nix = { version = "0.29.0", features = ["env", "fs", "hostname", "ioctl", "mount", "ptrace", "process", "resource", "sched", "socket", "signal", "term", "user"] }
oci-spec = { version = "0.10.0", optional = true }
postcard = { version = "1.1.3", features = ["alloc"] }
procfs = "0.18.0"
route_manager = { version = "0.2.11", optional = true }
sendfd = { version = "0.4.4", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tun-rs = { version = "2.8.3", optional = true }

[dev-dependencies]
assertables = "10.1.0"
regex = "1.12.3"

[features]
default = []
cgroups = ["dep:libcgroups", "dep:oci-spec"]
landlock = ["dep:landlock"]
seccomp = ["dep:libseccomp"]
rustslirp = ["dep:route_manager", "dep:sendfd", "dep:tun-rs"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "startup-exit-fixture"
path = "tests/support/startup_exit_fixture.rs"
